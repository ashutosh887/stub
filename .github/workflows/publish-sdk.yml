name: Publish SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that publishes over OIDC (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@^11.5.1
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        working-directory: sdk
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag sdk-v$tag does not match sdk/package.json version $pkg"
            exit 1
          fi
      - name: Extract release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          version="${GITHUB_REF_NAME#sdk-v}"
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[[a-z0-9]/ { exit }
            found { print }
          ' sdk/CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "using the sdk/CHANGELOG.md section for $version"
          else
            echo "::warning::no sdk/CHANGELOG.md section for $version; falling back to generated notes"
            rm -f release-notes.md
          fi
      - name: Build and publish
        working-directory: sdk
        run: |
          npm install
          npm run build
          npm publish --access public --provenance
      - name: Create the matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#sdk-v}"
          if [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "trystub $version" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "trystub $version" \
              --generate-notes \
              --latest
          fi
