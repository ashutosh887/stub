name: Publish SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that publishes over OIDC (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@^11.5.1
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        working-directory: sdk
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag sdk-v$tag does not match sdk/package.json version $pkg"
            exit 1
          fi
          if ! grep -q "^## \[$pkg\] - " CHANGELOG.md; then
            echo "::error::sdk/CHANGELOG.md has no released section for $pkg"
            exit 1
          fi
      - name: Build and publish
        working-directory: sdk
        run: |
          npm install
          npm run build
          npm publish --access public --provenance
