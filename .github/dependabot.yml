version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      app:
        patterns: ["*"]
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
  - package-ecosystem: npm
    directory: /sdk
    schedule:
      interval: weekly
    groups:
      sdk:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /.github/actions/db-guardrail
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
