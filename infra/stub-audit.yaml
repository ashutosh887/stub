AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stub audit trail (WA SEC04-BP01, SEC04-BP02). Deployed once, in the home Region: the account's
  multi-Region CloudTrail trail with log file validation, its bucket (TLS only, versioned, public
  access blocked, no object or version deletes by any principal, lifecycle to Glacier Instant
  Retrieval at 90 days and expiry, which S3 runs outside the bucket policy), and the AWS Config
  service-linked role that every Region's recorder in stub-detection.yaml uses. The bucket also
  receives the AWS Config snapshots from those recorders.

Parameters:
  LogBucketName:
    Type: String
    Description: Globally unique name for the audit log bucket.
  LogRetentionDays:
    Type: Number
    Default: 365

Resources:
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref LogBucketName
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: retain-then-expire
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      Tags:
        - { Key: wa-best-practice, Value: SEC04-BP01 }
        - { Key: managed-by, Value: aws-well-architected-review }

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt LogBucket.Arn
              - !Sub ${LogBucket.Arn}/*
            Condition:
              Bool: { aws:SecureTransport: "false" }
          - Sid: DenyLogDeletes
            Effect: Deny
            Principal: "*"
            Action: s3:DeleteObject*
            Resource: !Sub ${LogBucket.Arn}/*
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt LogBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/wa-stub-audit
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub ${LogBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/wa-stub-audit
          - Sid: ConfigAclCheck
            Effect: Allow
            Principal: { Service: config.amazonaws.com }
            Action: [s3:GetBucketAcl, s3:ListBucket]
            Resource: !GetAtt LogBucket.Arn
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
          - Sid: ConfigWrite
            Effect: Allow
            Principal: { Service: config.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub ${LogBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: LogBucketPolicy
    Properties:
      TrailName: wa-stub-audit
      S3BucketName: !Ref LogBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
      Tags:
        - { Key: wa-best-practice, Value: SEC04-BP01 }
        - { Key: managed-by, Value: aws-well-architected-review }

  ConfigServiceRole:
    Type: AWS::IAM::ServiceLinkedRole
    Properties:
      AWSServiceName: config.amazonaws.com

Outputs:
  LogBucketName:
    Value: !Ref LogBucket
  TrailArn:
    Value: !GetAtt Trail.Arn
